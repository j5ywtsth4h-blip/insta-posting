name: Instagram posten

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde (Minute 7)
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        default: verbindung-testen
        options:
          - verbindung-testen
          - profil-anzeigen
          - geplante-pruefen
          - faellige-jetzt-posten
          - facebook-beitrag-loeschen
      facebook_id:
        description: "Nur zum Löschen: Facebook-ID des Beitrags"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-posting
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bildwerkzeuge installieren
        run: pip install pillow pillow-heif

      - name: Git einrichten
        run: |
          git config user.name "insta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verbindung testen
        if: github.event_name == 'workflow_dispatch' && inputs.aktion == 'verbindung-testen'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/post.py test

      - name: LinkedIn-Verbindung testen
        if: github.event_name == 'workflow_dispatch' && inputs.aktion == 'verbindung-testen'
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ORG_TOKEN: ${{ secrets.LINKEDIN_ORG_TOKEN }}
          LINKEDIN_PROFIL: ${{ vars.LINKEDIN_PROFIL }}
        run: python scripts/linkedin.py test

      - name: Profil anzeigen (postet nichts)
        if: github.event_name == 'workflow_dispatch' && inputs.aktion == 'profil-anzeigen'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/post.py profil

      - name: Geplante Beiträge prüfen (postet nichts)
        if: github.event_name == 'workflow_dispatch' && inputs.aktion == 'geplante-pruefen'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/post.py pruefen

      - name: Facebook-Beitrag löschen
        if: github.event_name == 'workflow_dispatch' && inputs.aktion == 'facebook-beitrag-loeschen'
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_BEITRAG: ${{ inputs.facebook_id }}
        run: python scripts/post.py fb-loeschen

      - name: Fällige Beiträge posten
        if: github.event_name == 'schedule' || inputs.aktion == 'faellige-jetzt-posten'
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python scripts/post.py post

      - name: Fällige LinkedIn-Beiträge posten
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.aktion == 'faellige-jetzt-posten') }}
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_ORG_ID: ${{ secrets.LINKEDIN_ORG_ID }}
          LINKEDIN_ORG_TOKEN: ${{ secrets.LINKEDIN_ORG_TOKEN }}
          LINKEDIN_PROFIL: ${{ vars.LINKEDIN_PROFIL }}
        run: python scripts/linkedin.py post
